name: sns-recommend-course
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recommend
      POSTGRES_PASSWORD: recommend
      POSTGRES_DB: recommend
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["recommend-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommend -d recommend"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    profiles: [app]
    ports: ["127.0.0.1:8001:8001"]
    environment:
      DATABASE_URL: postgresql://recommend:recommend@db:5432/recommend
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-course-local-token}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["sh", "-c", "uv run sns-recommend init && uv run uvicorn sns_recommend.api:app --host 0.0.0.0 --port 8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: .
    volumes: ["./recordings:/app/recordings"]
    profiles: [app]
    environment:
      DATABASE_URL: postgresql://recommend:recommend@db:5432/recommend
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-course-local-token}
      MODEL_MODE: ${MODEL_MODE:-fixture}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      RERANK_MODEL: ${RERANK_MODEL:-gemini-3.5-flash-lite}
      DAILY_CALL_LIMIT: ${DAILY_CALL_LIMIT:-20}
    depends_on:
      api: {condition: service_healthy}
    command: ["uv", "run", "python", "-m", "sns_recommend.worker"]
volumes:
  recommend-db:
